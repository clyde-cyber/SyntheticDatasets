[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntheticdatasets"
version = "0.1.0"
description = "ML workspace for real and synthetic tabular datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clyde Igot" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.5,<3",
  "pyyaml>=6.0,<7",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
sd-generate = "syntheticdatasets.data.synthetic:main"
sd-train = "syntheticdatasets.training.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
